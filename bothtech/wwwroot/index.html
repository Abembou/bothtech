    <!-- 4. FONCTIONS JAVASCRIPT POUR LE MICROPHONE (SÉCURISÉES)   -->
    <!-- ========================================================= -->
    <script>
        window.audioChat = {
            mediaRecorder: null,
            audioChunks: [],

            startRecording: async function () {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    console.error("L'API micro est introuvable. Assurez-vous que le WebView a les permissions requises.");
                    return false;
                }

                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    this.mediaRecorder = new MediaRecorder(stream);
                    this.audioChunks = [];

                    this.mediaRecorder.ondataavailable = event => {
                        if (event.data.size > 0) {
                            this.audioChunks.push(event.data);
                        }
                    };

                    this.mediaRecorder.start();
                    return true;
                } catch (err) {
                    console.error("Accès au micro refusé ou erreur technique:", err);
                    return false;
                }
            },

            stopRecording: async function () {
                return new Promise((resolve) => {
                    if (!this.mediaRecorder || this.mediaRecorder.state === "inactive") {
                        resolve(null);
                        return;
                    }

                    this.mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(this.audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = () => {
                            resolve(reader.result);
                        };

                        this.mediaRecorder.stream.getTracks().forEach(track => track.stop());
                    };

                    this.mediaRecorder.stop();
                });
            },

            cancelRecording: function () {
                if (this.mediaRecorder && this.mediaRecorder.state !== "inactive") {
                    this.mediaRecorder.stop();
                    this.mediaRecorder.stream.getTracks().forEach(track => track.stop());
                }
                this.mediaRecorder = null;
                this.audioChunks = [];
            },

            playAudio: function (base64Audio) {
                if (base64Audio) {
                    const audio = new Audio(base64Audio);
                    audio.play().catch(e => console.error("Erreur de lecture audio:", e));
                }
            }
        };
    </script>
